# Builds the website (docs/ + SECURITY.md + CONTRIBUTING.md) with one shared design and deploys it to GitHub Pages.
name: Pages
on:
  push:
    branches: [main]
    paths: ["docs/**", "SECURITY.md", "CONTRIBUTING.md", "llms.txt", "tools/assemble-site.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: sh tools/assemble-site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - uses: actions/upload-pages-artifact@v3
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
