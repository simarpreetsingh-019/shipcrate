name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    if: github.repository == 'simarpreetsingh-019/shipcrate'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Quality gate (shell syntax, secrets, workflow guardrails, init + shipped tests for every type and language)
        run: sh scripts/check.sh
  windows:
    if: github.repository == 'simarpreetsingh-019/shipcrate'
    # Windows: generate a Windows-target CLI, parse install.ps1, run the shipped tests under Git Bash.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Generate a Windows project
        run: |
          mkdir -p "$RUNNER_TEMP/w" && sh bin/shipcrate init "$RUNNER_TEMP/w" --yes --name wincli --type cli --lang rust \
            --repo example/wincli --targets "windows-x64 linux-x64"
          ! grep -rnoE '\{\{[A-Z_]+\}\}' "$RUNNER_TEMP/w"
      - name: PowerShell parses install.ps1
        shell: pwsh
        run: ./tests/parse-ps1.ps1 "$env:RUNNER_TEMP/w/install.ps1"
      - name: Shipped tests (scripts + Rust updater)
        run: cd "$RUNNER_TEMP/w" && git init -q && sh tests/shipcrate/run.sh
  action:
    # The GitHub Action (action.yml) works from a workflow, run against the example projects.
    if: github.repository == 'simarpreetsingh-019/shipcrate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check (quick) on the Python example
        uses: ./
        with:
          command: check
          args: --quick
          working-directory: examples/python-cli
      - name: release-notes on the Rust example
        id: notes
        uses: ./
        with:
          command: release-notes
          args: "1.0.0"
          working-directory: examples/rust-cli
      - name: the output is usable in later steps
        env:
          NOTES: ${{ steps.notes.outputs.output }}
        run: printf '%s' "$NOTES" | grep -q "What's new"
      - name: unknown commands are refused
        id: bad
        continue-on-error: true
        uses: ./
        with:
          command: release
      - run: test "${{ steps.bad.outcome }}" = failure
