# Releases for {{PRODUCT}} (from shipcrate). Anyone can check a download came from this repository:
#   gh attestation verify <file> --repo {{REPO}}
# BUILD_WHERE=ci    (release.conf): a v* tag builds every target in TARGETS on its own runner, then one job
#                   publishes the release with checksums, latest.json and a build-provenance attestation.
# BUILD_WHERE=local: release.sh uploads the build; publishing the release attests the uploaded files.
# Every release also gets, for free: an SBOM (what's inside, SPDX), an SBOM attestation, and keyless Sigstore
# signatures (<file>.sigstore.json) that anyone can check with cosign. No keys to manage.
# Optional repository secrets: RELEASE_WEBHOOK_URL, RELEASE_WEBHOOK_SECRET (see scripts/notify.sh).
name: Release
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag: { description: "Release tag to attest (e.g. v1.2.0)", required: true }
permissions:
  contents: read
jobs:
  plan:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      ci: ${{ steps.plan.outputs.ci }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        run: |
          . ./release.conf; . scripts/lib.sh
          echo "ci=$([ "$BUILD_WHERE" = ci ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
          m=""; for t in $TARGETS; do m="$m{\"target\":\"$t\",\"runner\":\"$(runner_for "$t")\"},"; done
          echo "matrix={\"include\":[${m%,}]}" >> "$GITHUB_OUTPUT"
  gate:
    needs: plan
    if: needs.plan.outputs.ci == 'yes'
    runs-on: {{RUNNER}}
    steps:
      - uses: actions/checkout@v4
      - name: Install lint and audit tools
        run: sh scripts/ci-tools.sh
      - name: Quality gate (release mode)
        run: sh scripts/check.sh --release
  build:
    needs: [plan, gate]
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build and package ${{ matrix.target }}
        run: sh scripts/build-release.sh "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Verify every checksum before publishing
        run: cd dist && for f in *.sha256; do sha256sum -c "$f"; done
      - name: Notes and manifest (signed if signed updates are on)
        env:
          TAG: ${{ github.ref_name }}
          SHIPCRATE_SIGNING_KEY: ${{ secrets.SHIPCRATE_SIGNING_KEY }}
        run: |
          sh scripts/release-notes.sh "${TAG#v}" > dist/notes.md
          sh scripts/manifest.sh "${TAG#v}"
      - name: SBOM (software bill of materials)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/{{TOKEN}}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/attest-sbom@v4
        with:
          subject-path: "dist/*.tar.gz, dist/*.zip"
          sbom-path: dist/{{TOKEN}}.sbom.spdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Keyless Sigstore signatures
        run: |
          cd dist
          for f in *.tar.gz *.zip latest.json; do
            [ -f "$f" ] && cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null
          done
          ls *.sigstore.json
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          . ./release.conf
          prerelease=""; case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          find dist -maxdepth 1 -type f ! -name notes.md -print0 | xargs -0 gh release create "$TAG" --title "$PRODUCT ${TAG#v}" --notes-file dist/notes.md $prerelease
      - name: Update the beta channel (beta.json)
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/channel.sh dist/latest.json
      - name: Notify your systems (optional webhook)
        env:
          RELEASE_WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
        run: sh scripts/notify.sh
  attest-upload:
    if: github.event_name != 'push' && github.event.release.tag_name != 'channel'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist && rm -f dist/*.sha256 dist/SHA256SUMS dist/*.sigstore.json
      - name: SBOM (software bill of materials)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom/{{TOKEN}}.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*
      - uses: actions/attest-sbom@v4
        with:
          subject-path: "dist/*.tar.gz, dist/*.zip"
          sbom-path: sbom/{{TOKEN}}.sbom.spdx.json
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Keyless Sigstore signatures, uploaded to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          cd dist
          for f in *.tar.gz *.zip latest.json; do [ -f "$f" ] && cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" >/dev/null; done
          gh release upload "$TAG" *.sigstore.json ../sbom/*.spdx.json --repo "$GITHUB_REPOSITORY" --clobber
