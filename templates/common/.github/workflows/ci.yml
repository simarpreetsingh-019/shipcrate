# Runs the same quality gate as the pre-push hook, on a clean machine (from shipcrate).
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  gate:
    runs-on: {{RUNNER}}
    steps:
      - uses: actions/checkout@v4
      - name: Quality gate
        run: sh scripts/check.sh
