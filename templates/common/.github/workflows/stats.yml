# Daily download snapshot (from shipcrate): saves GitHub's public download counts to stats.csv on the `stats` branch,
# so you get history and per-day growth even when counts restart. No tracking; nothing touches your app.
# Added by shipcrate sync when STATS_SNAPSHOTS='on' in release.conf (it isn't installed while snapshots are off).
# Read it: git fetch origin stats && git show origin/stats:stats.csv > stats.csv && sh scripts/stats.sh --history stats.csv
name: Stats
on:
  schedule:
    - cron: "17 3 * * *"   # daily, 03:17 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stats
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append today's counts to stats.csv on the stats branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./release.conf
          [ "${STATS_SNAPSHOTS:-off}" = on ] || [ "${{ github.event_name }}" = workflow_dispatch ] || { echo "Snapshots are off (STATS_SNAPSHOTS in release.conf)"; exit 0; }
          sh scripts/stats.sh --csv > /tmp/today.csv
          git config user.name "shipcrate-stats"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch -q origin stats 2>/dev/null; then git switch -q stats; else git switch -q --orphan stats && git rm -rfq . 2>/dev/null || true; fi
          [ -f stats.csv ] || echo "date,tag,file,count" > stats.csv
          grep -v "^$(date -u +%Y-%m-%d)," stats.csv > /tmp/keep.csv || true
          cat /tmp/keep.csv /tmp/today.csv > stats.csv
          git add stats.csv
          git diff --cached --quiet || { git commit -qm "stats $(date -u +%Y-%m-%d)" && git push -q origin stats; }
