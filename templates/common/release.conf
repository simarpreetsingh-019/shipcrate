# shipcrate settings for {{PRODUCT}}. Plain shell, read by scripts/*.sh and the release workflow.
# No secrets here: GitHub access comes from `gh auth login` locally and GITHUB_TOKEN in Actions.
# The shipcrate release these files came from. `shipcrate sync` updates it (only from shipcrate releases).
SHIPCRATE_VERSION='{{KIT_VERSION}}'
PRODUCT='{{PRODUCT}}'          # display name
TOKEN='{{TOKEN}}'              # lowercase name: Homebrew token, cache folder
TYPE='{{TYPE}}'                # app (macOS .app, Homebrew cask) | cli (binary, Homebrew formula)
KIT_LANG='{{LANG}}'            # rust | swift | python | node: picks the quality-gate steps
REPO='{{REPO}}'                # GitHub owner/name of this project
TAP_REPO='{{TAP_REPO}}'        # Homebrew tap owner/homebrew-name, or "none"
TAP_FILE='{{TAP_FILE}}'        # file inside the tap that release.sh bumps
BINARY='{{BINARY}}'            # cli: executable name inside the archive
BUNDLE_ID='{{BUNDLE_ID}}'      # app: CFBundleIdentifier, checked by install.sh and the updater
# Platforms to build, each on its own CI runner: macos-arm64 macos-x64 linux-x64 linux-arm64 windows-x64 windows-arm64,
# "macos" for a macOS app, or "any" for one platform-independent build (Python zipapp, JS bundle).
TARGETS='{{TARGETS}}'
ASSET='{{ASSET}}'              # release file name; {target} becomes the target; Windows builds become .zip

# How to build. ARTIFACT is the built .app (app) or executable (cli) that gets packaged.
# BUILD_CMD runs with $TARGET set (e.g. linux-x64), in case your build needs it.
BUILD_CMD='{{BUILD_CMD}}'
ARTIFACT='{{ARTIFACT}}'
# How to write version $V into the project's own files (run by release.sh before building).
VERSION_CMD='{{VERSION_CMD}}'
# Where release builds happen: "local" (release.sh builds and uploads; CI attests the upload)
# or "ci" (release.sh pushes the tag; .github/workflows/release.yml builds, publishes and attests).
BUILD_WHERE='{{BUILD_WHERE}}'
# Optional last line for release notes, e.g. 'Made by Your Name · https://example.com'. Leave empty for none.
CREDIT=''
# Releases that change shipcrate's code or the updater roll out over this many days (release.sh --full-rollout skips).
SAFE_ROLLOUT_DAYS='7'
# Daily download snapshots to the `stats` branch (history for `shipcrate stats --history`): on | off.
# After turning it on, run `shipcrate sync` to add the workflow (no workflow, and no Actions minutes, while it's off).
STATS_SNAPSHOTS='off'
# Signed updates: the Ed25519 public key apps/CLIs trust (set by scripts/keygen.sh). Empty = off.
# The private key never goes here: it lives in ~/.config/shipcrate/ and the SHIPCRATE_SIGNING_KEY secret.
PUBLIC_KEY=''
# Release webhook for your own notification/push servers: set RELEASE_WEBHOOK_URL (+ RELEASE_WEBHOOK_SECRET)
# as repository secrets or in your shell. NEVER here. See scripts/notify.sh and docs in SECURITY.md.
