# GitHub Pages site for shipcrate. Built by .github/workflows/pages.yml (which also copies SECURITY.md and
# CONTRIBUTING.md in from the repo root), so every page shares one design.
title: shipcrate
url: https://simarpreetsingh-019.github.io
baseurl: /shipcrate
description: Release and update tooling for your products, in one command.
version: "0.4.0"     # shown on the site and in structured data; bump with each release
plugins:
  - jekyll-sitemap   # /sitemap.xml for search engines
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
exclude: [README.md, "*.md.orig"]
defaults:
  - scope: { path: "quickstart.md" }
    values: { layout: doc, permalink: /quickstart/, title: "Quick start", kicker: "Get started",
              description: "From zero to a verified, multi-platform release in about five minutes.",
              next: ["Integrating", "/integrating/"] }
  - scope: { path: "INTEGRATING.md" }
    values: { layout: doc, permalink: /integrating/, title: "Integrating", kicker: "Docs",
              description: "Bring shipcrate into an existing project, release process or notification system.",
              prev: ["Quick start", "/quickstart/"], next: ["Platforms", "/platforms/"] }
  - scope: { path: "PLATFORMS.md" }
    values: { layout: doc, permalink: /platforms/, title: "Platforms", kicker: "Docs",
              description: "macOS, Linux and Windows: targets, runners, installers and code signing.",
              prev: ["Integrating", "/integrating/"], next: ["Security", "/security/"] }
  - scope: { path: "security-page.md" }
    values: { layout: doc, permalink: /security/, title: "Security", kicker: "Trust",
              description: "What shipcrate guarantees for every release, the tests that guard it, and its limits.",
              prev: ["Platforms", "/platforms/"], next: ["AI agents", "/agents/"] }
  - scope: { path: "agents.md" }
    values: { layout: doc, permalink: /agents/, title: "AI agents", kicker: "Agents",
              description: "Connect Claude Code, Codex, Cursor, VS Code or any agent. One command each.",
              prev: ["Security", "/security/"], next: ["Contributing", "/contributing/"] }
  - scope: { path: "contributing-page.md" }
    values: { layout: doc, permalink: /contributing/, title: "Contributing", kicker: "Community",
              description: "Fix a bug, add a language or platform, or improve the docs.",
              prev: ["AI agents", "/agents/"] }
