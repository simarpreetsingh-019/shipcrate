<!doctype html>
<!-- Social preview card (1200×630). Regenerate: sh tools/og-card.sh -->
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden;background:#000;font-family:Inter,sans-serif;color:#f5f5f7}
.bg{position:absolute;inset:0;background:radial-gradient(520px 320px at 78% 30%,rgba(123,92,255,.42),transparent 70%),radial-gradient(520px 320px at 92% 85%,rgba(255,45,120,.35),transparent 70%),radial-gradient(600px 360px at 8% 110%,rgba(255,95,31,.32),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(800px 500px at 70% 40%,#000,transparent 75%)}
.c{position:absolute;inset:0;padding:68px 76px;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:14px;font-weight:800;font-size:34px;letter-spacing:-.02em}
.logo i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ff5f1f,#ff2d78,#7b5cff)}
h1{font-size:96px;line-height:.98;letter-spacing:-.05em;font-weight:800;margin-top:54px}
.g{background:linear-gradient(100deg,#ff5f1f,#ff2d78 50%,#7b5cff);-webkit-background-clip:text;color:transparent}
p{font-size:28px;color:#a1a1aa;margin-top:26px;letter-spacing:-.01em;max-width:700px;font-weight:500}
.chips{position:absolute;left:76px;bottom:62px;display:flex;gap:12px}
.chips span{font-size:19px;font-weight:600;padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12)}
.term{position:absolute;right:64px;top:150px;width:350px;border-radius:18px;background:rgba(14,14,18,.88);border:1px solid rgba(255,255,255,.1);box-shadow:0 30px 80px -20px rgba(255,45,120,.4);font:500 15px/1.85 "JetBrains Mono",monospace;padding:18px 20px;color:#e8e8ee}
.term .d{display:flex;gap:7px;margin-bottom:12px}.term .d b{width:11px;height:11px;border-radius:50%;background:#ff5f57}.term .d b:nth-child(2){background:#febc2e}.term .d b:nth-child(3){background:#28c840}
.k{color:#30d158}.m{color:#6b6b75}.o{color:#ff8a4c}
.url{position:absolute;right:76px;bottom:70px;font:500 18px "JetBrains Mono",monospace;color:#6b6b75}
</style></head><body>
<div class="bg"></div><div class="grid"></div>
<div class="c">
  <div class="logo"><i></i>shipcrate</div>
  <h1>Ship it.<br><span class="g">Safely.<br>Everywhere.</span></h1>
  <p>Release &amp; update tooling in one command.</p>
</div>
<div class="term"><div class="d"><b></b><b></b><b></b></div>
<span class="m">$</span> release.sh 1.4.0<br>
<span class="k">✓</span> guardrails<br>
<span class="k">✓</span> gate · audit · secrets<br>
<span class="k">✓</span> <span class="o">5</span> platforms built<br>
<span class="k">✓</span> SHA-256 · provenance<br>
<span class="k">✓</span> Homebrew · webhook<br>
<span class="k">✓ released</span></div>
<div class="chips"><span>macOS</span><span>Linux</span><span>Windows</span><span>MCP-ready</span></div>
<div class="url">simarpreetsingh-019.github.io/shipcrate</div>
</body></html>
